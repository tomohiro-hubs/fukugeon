<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現在調整中です｜株式会社福GEON</title>
    <meta name="description" content="現在、サイトを調整中です。ご不便をおかけしますが、公開まで今しばらくお待ちください。">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <style>
        :root {
            --bg: #f7f7f5;
            --text: #1f2937;
            --accent: #111827;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 65%);
            color: var(--text);
            padding: 24px;
        }
        .panel {
            width: 100%;
            max-width: 680px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 48px 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.7rem, 3vw, 2.2rem);
            line-height: 1.35;
            color: var(--accent);
        }
        p {
            margin: 0;
            line-height: 1.8;
            font-size: 1rem;
            color: #374151;
        }
        .sub {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>現在サイトを調整中です</h1>
        <p>
            株式会社福GEONのWebサイトは、現在メンテナンス・調整作業を行っております。<br>
            ご不便をおかけし申し訳ございません。公開まで今しばらくお待ちください。
        </p>
        <p class="sub">© 株式会社福GEON</p>
    </main>
</body>
</html>
